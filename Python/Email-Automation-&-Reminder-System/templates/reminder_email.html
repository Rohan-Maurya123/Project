<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: Arial, sans-serif; padding: 20px; border: 1px solid #ddd; }
        .header { background-color: #f4f4f4; padding: 10px; text-align: center; }
        .content { margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ reminder_type }}</h2>
        </div>
        <div class="content">
            <p>Hello <strong>{{ name }}</strong>,</p>
            <p>This is a friendly reminder from your <strong>{{ department }}</strong> team.</p>
            <p>Your scheduled <strong>{{ reminder_type }}</strong> is set for <strong>{{ reminder_time }}</strong> today.</p>
            <p>Please take the necessary actions accordingly.</p>
        </div>
        <div class="footer">
            <p>Automated by Email Automation & Reminder System</p>
        </div>
    </div>
</body>
</html>
